<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="健身打卡"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>健身打卡</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1e3229;background:#f6f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 32px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:26px;margin:0;letter-spacing:-.6px}.tag{font-size:12px;color:#4d7e61;background:#e6f2e8;border-radius:30px;padding:7px 11px}.hero{background:#e3f0e4;border-radius:26px;padding:25px 22px;margin-bottom:14px}.hero small{color:#52755e}.hero h2{font-size:29px;margin:9px 0 7px}.hero p{font-size:14px;color:#5c7563;margin:0 0 22px}button{font:inherit;cursor:pointer}#check{width:100%;background:#23774b;color:white;border:0;border-radius:17px;padding:18px;font-size:18px;font-weight:700}#check.done{background:#a6c8af;color:#19452e}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.stat,.panel{background:white;border:1px solid #e8eee8;border-radius:21px;padding:20px}.stat small{color:#728176;font-size:12px}.stat strong{display:block;font-size:31px;margin-top:5px}.panel{margin-top:14px}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.month strong{font-size:18px}.arrow{border:0;background:#f1f5f1;border-radius:12px;width:38px;height:38px;font-size:22px;color:#3b5744}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar div{text-align:center;display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:14px;border-radius:12px}.weekday{font-size:12px!important;color:#8b998e}.marked{background:#d9efdf;color:#1a7542;font-weight:700}.today{outline:1px solid #a3bba9}.settings{margin-top:18px}.settings summary{font-size:14px;color:#667b6b;padding:12px 4px;cursor:pointer}.settings button,.settings label{display:inline-block;background:white;border:1px solid #dbe5dc;border-radius:12px;padding:11px;margin:6px 5px 6px 0;font-size:13px;color:#325440}.settings input{display:none}.hint{font-size:12px;color:#718274;line-height:1.6}.message{min-height:19px;color:#27724a;font-size:13px;margin-top:9px}footer{text-align:center;font-size:12px;color:#9aa69b;margin-top:20px}
</style></head><body><main>
<header><h1>健身打卡</h1><span class="tag">每天一点坚持</span></header>
<section class="hero"><small id="dateLabel"></small><h2 id="headline">今天上课了吗？</h2><p id="subline">完成课程后，点一下就记录。</p><button id="check" type="button">✓ 今天上课 · 打卡</button><div class="message" id="message" aria-live="polite"></div></section>
<section class="stats"><div class="stat"><small>累计上课</small><strong id="total">0</strong></div><div class="stat"><small>本月上课</small><strong id="monthly">0</strong></div></section>
<section class="panel"><div class="month"><button class="arrow" id="prev" aria-label="上个月">‹</button><strong id="monthTitle"></strong><button class="arrow" id="next" aria-label="下个月">›</button></div><div class="calendar" id="calendar"></div></section>
<details class="settings"><summary>设置与数据备份</summary><button id="undo">撤销今日打卡</button><button id="export">导出备份</button><label for="import">导入备份</label><input id="import" type="file" accept=".json,application/json"><p class="hint">记录只保存在这台设备的当前应用中。请定期导出备份。Safari 与主屏幕 App 可能使用不同的数据空间，请在主屏幕 App 中完成日常打卡和备份。</p></details>
<footer>仅记录上课日期 · 不收集课程内容</footer></main>
<script>
(()=>{'use strict';
const KEY='fitness-checkin-v1';
const initial=['2026-10-26','2026-10-28','2026-11-03','2026-11-04','2026-11-05','2026-11-10','2026-11-12'];
const el=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const localDay=d=>[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-');
const valid=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&localDay(new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10))))===s;
let records;
try{const raw=localStorage.getItem(KEY);if(raw===null){records=initial.slice();localStorage.setItem(KEY,JSON.stringify(records))}else{const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(valid))throw Error('记录格式错误');records=[...new Set(parsed)].sort()}}catch(e){records=[];alert('本机记录读取失败。为避免覆盖旧数据，当前不允许修改。请先检查或备份数据。');window.readOnly=true}
const now=new Date();let year=now.getFullYear(),month=now.getMonth();
const save=()=>{if(window.readOnly)return false;try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert('保存失败，请检查 Safari 存储空间');return false}};
const msg=t=>el('message').textContent=t;
function render(){const d=new Date(),today=localDay(d),done=records.includes(today);el('dateLabel').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});el('headline').textContent=done?'今天已完成！':'今天上课了吗？';el('subline').textContent=done?'今天的上课记录已经保存。':'完成课程后，点一下就记录。';el('check').textContent=done?'✓ 今日已打卡':'✓ 今天上课 · 打卡';el('check').classList.toggle('done',done);el('check').disabled=done||!!window.readOnly;el('total').textContent=records.length;const prefix=year+'-'+pad(month+1)+'-';el('monthly').textContent=records.filter(x=>x.startsWith(prefix)).length;el('monthTitle').textContent=year+'年'+(month+1)+'月';const grid=el('calendar');grid.replaceChildren();['一','二','三','四','五','六','日'].forEach(x=>{const n=document.createElement('div');n.className='weekday';n.textContent=x;grid.append(n)});const offset=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<offset;i++)grid.append(document.createElement('div'));for(let i=1;i<=new Date(year,month+1,0).getDate();i++){const n=document.createElement('div'),date=prefix+pad(i);n.textContent=i;if(records.includes(date))n.classList.add('marked');if(date===today)n.classList.add('today');grid.append(n)}}
el('check').onclick=()=>{const today=localDay(new Date());if(records.includes(today))return;records.push(today);records.sort();if(!save()){records=records.filter(x=>x!==today);return}msg('打卡成功，已保存');render()};
el('undo').onclick=()=>{const today=localDay(new Date());if(!records.includes(today)){msg('今天没有打卡记录');return}if(!confirm('确认撤销今天的打卡？'))return;records=records.filter(x=>x!==today);if(save()){msg('已撤销');render()}};
el('prev').onclick=()=>{const d=new Date(year,month-1,1);year=d.getFullYear();month=d.getMonth();render()};
el('next').onclick=()=>{const d=new Date(year,month+1,1);year=d.getFullYear();month=d.getMonth();render()};
el('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'fitness-checkin',version:1,dates:records,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='健身打卡备份-'+localDay(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('import').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.app!=='fitness-checkin'||!Array.isArray(obj.dates)||!obj.dates.every(valid))throw Error('文件不是有效的健身打卡备份');const merged=[...new Set([...records,...obj.dates])].sort();if(!confirm('将导入 '+obj.dates.length+' 条记录，合并后共 '+merged.length+' 条，不会删除现有记录。继续吗？'))return;const old=records;records=merged;if(!save())records=old;else{msg('导入成功');render()}}catch(err){alert(err.message)}finally{e.target.value=''}};
render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
